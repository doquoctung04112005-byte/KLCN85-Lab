<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}KLCN85{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark">
        <div class="container d-flex flex-wrap gap-3">
            <a class="navbar-brand mb-0" href="{% url 'home' %}">KLCN85</a>
            {% if request.user.is_authenticated %}
                <div class="d-flex flex-wrap align-items-center gap-3 ms-auto">
                    <a class="text-white text-decoration-none" href="{% url 'dashboard' %}">Dashboard</a>
                    <a class="text-white text-decoration-none" href="{% url 'document_list' %}">Tài liệu</a>
                    {% if request.user.profile.role == "admin" %}
                        <a class="text-white text-decoration-none" href="{% url 'user_list' %}">Người dùng</a>
                    {% endif %}
                    <a class="text-white text-decoration-none" href="{% url 'profile' %}">Hồ sơ cá nhân</a>
                    <span class="text-white-50">{{ request.user.get_username }}</span>
                    <form method="post" action="{% url 'logout' %}" class="m-0">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-outline-light btn-sm">Đăng xuất</button>
                    </form>
                </div>
            {% else %}
                <a class="btn btn-outline-light btn-sm ms-auto" href="{% url 'login' %}">Đăng nhập</a>
            {% endif %}
        </div>
    </nav>

    <main class="container py-5">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
